name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline. No setup-xcode: the image default is already Xcode 26.6,
          # and pinning '26' resolved to an Xcode too old for the runner's OS.
          - runner: macos-26
            experimental: false
          - runner: xcode-27
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # Ask xcodebuild what IT can target, not simctl. If the iOS platform
      # is missing for the selected Xcode, install it and try once more.
      - name: Pick a simulator
        id: sim
        working-directory: Calculator
        run: |
          pick() {
            xcodebuild -project Calculator.xcodeproj -scheme Calculator \
                       -showdestinations 2>/dev/null \
              | awk '/Available destinations/{f=1;next} /Ineligible destinations/{f=0} f' \
              | tr -d '{}' \
              | grep 'platform:iOS Simulator' \
              | grep -v 'placeholder' \
              | grep -v 'Designed for' \
              | grep 'name:iPhone' \
              | sed -E 's/.*OS:([0-9.]+).*name:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1|\2/' \
              | sort -t'|' -k1,1V \
              | tail -1
          }

          LINE=$(pick)

          if [ -z "$LINE" ]; then
            echo "No iOS Simulator destinations. Installing the iOS platform..."
            xcodebuild -downloadPlatform iOS
            LINE=$(pick)
          fi

          if [ -z "$LINE" ]; then
            echo "::error::Still no iOS Simulator destination for $(xcodebuild -version | head -1)."
            xcodebuild -project Calculator.xcodeproj -scheme Calculator -showdestinations || true
            exit 1
          fi

          OS="${LINE%%|*}"
          NAME="${LINE#*|}"
          echo "os=$OS"     >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using $NAME on iOS $OS"

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run tests
        working-directory: Calculator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -testPlan Calculator \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=${{ steps.sim.outputs.os }}" \
            -resultBundlePath TestResults.xcresult \
            -only-testing:CalculatorTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults-${{ matrix.runner }}
          path: Calculator/TestResults.xcresult
          if-no-files-found: warn
